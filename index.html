<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lil Pump & the Boys Run Amok in the City - RSVP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 700px;
            margin: 0 auto;
        }
        
        .header {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8c3a 100%);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            color: white;
            box-shadow: 0 8px 30px rgba(255, 107, 107, 0.3);
        }
        
        .header h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }
        
        .event-item {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            align-items: flex-start;
        }
        
        .event-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 4px;
        }
        
        .event-value {
            font-size: 16px;
            font-weight: 500;
            color: white;
        }
        
        .section {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }
        
        .section h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #667eea;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #333;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e5e5e5;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.2s;
        }
        
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            background: #f8f9ff;
        }
        
        button[data-fs-submit-btn] {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s;
        }
        
        button[data-fs-submit-btn]:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        button[data-fs-submit-btn]:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        [data-fs-error] {
            color: #d32f2f;
            font-size: 13px;
            margin-top: 4px;
            display: none;
        }
        
        [data-fs-error]:not(:empty) {
            display: block;
        }
        
        [data-fs-success] {
            padding: 1rem;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-radius: 8px;
            margin-top: 1rem;
            display: none;
            text-align: center;
            font-weight: 500;
        }
        
        .attendee {
            padding: 1rem;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            border: 2px solid #ff9a56;
            border-radius: 10px;
            margin-bottom: 0.75rem;
        }
        
        .attendee-info {
            flex: 1;
        }
        
        .attendee-name {
            font-weight: 600;
            color: #d97706;
            margin-bottom: 0.25rem;
        }
        
        .attendee-note {
            font-size: 13px;
            color: #b85c0d;
        }
        
        .maybe-section {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 2px solid #fbbf24;
        }
        
        .maybe-label {
            font-size: 13px;
            font-weight: 600;
            color: #d97706;
            margin-bottom: 0.5rem;
        }
        
        .maybe-item {
            padding: 0.75rem;
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border: 2px solid #fbbf24;
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }
        
        .maybe-name {
            font-size: 15px;
            color: #d97706;
            font-weight: 500;
        }
        
        .empty {
            color: #999;
            font-size: 14px;
        }
        
        .count {
            color: #667eea;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Lil Pump & the Boys Run Amok in the City</h1>
            <div class="event-item">
                <div>
                    <div class="event-label">📅 Date & time</div>
                    <div class="event-value">Friday, 12 June 2026 from 5pm onwards</div>
                </div>
            </div>
            <div class="event-item">
                <div>
                    <div class="event-label">📍 Location</div>
                    <div class="event-value">Sydney CBD</div>
                </div>
            </div>
            <div class="event-item">
                <div>
                    <div class="event-label">🍷 What's happening</div>
                    <div class="event-value">Drinks and potentially some food</div>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>RSVP</h2>
            <form id="my-form">
                <div class="form-group">
                    <label for="name">Your name *</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" data-fs-field required>
                    <span data-fs-error="name"></span>
                </div>
                
                <div class="form-group">
                    <label for="status">Are you coming?</label>
                    <select id="status" name="status" data-fs-field>
                        <option value="yes">Yes, I'm coming!</option>
                        <option value="maybe">Maybe, I'll let you know</option>
                        <option value="no">No, can't make it</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="dietary">Dietary preferences (optional)</label>
                    <input type="text" id="dietary" name="dietary" placeholder="E.g., vegetarian, allergies" data-fs-field>
                </div>
                
                <button type="submit" data-fs-submit-btn>Submit RSVP</button>
                <div data-fs-success>✓ Thanks for RSVPing!</div>
                <div data-fs-error></div>
            </form>
        </div>

        <div class="section">
            <h2>Attendees (<span class="count" id="count">0</span> confirmed)</h2>
            <div id="list"></div>
        </div>
    </div>

    <script>
        window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
        formspree('initForm', { formElement: '#my-form', formId: 'xeewqlze' });
    </script>
    <script src="https://unpkg.com/@formspree/ajax@1" defer></script>

    <script>
        const listDiv = document.getElementById('list');
        const countSpan = document.getElementById('count');

        // Removed "async" keyword here
        function loadAttendees() {
            try {
                const data = localStorage.getItem('formspree-submissions');
                return data ? JSON.parse(data) : [];
            } catch (e) {
                console.error('Error loading attendees:', e);
                return [];
            }
        }

        function saveToLocal(name, status, dietary) {
            const submissions = loadAttendees();
            submissions.push({
                name: name,
                status: status,
                dietary: dietary,
                timestamp: new Date().toLocaleString()
            });
            localStorage.setItem('formspree-submissions', JSON.stringify(submissions));
        }

        function displayAttendees() {
            const attendees = loadAttendees();
            const yes = attendees.filter(a => a.status === 'yes');
            const maybe = attendees.filter(a => a.status === 'maybe');

            countSpan.textContent = yes.length;

            if (attendees.length === 0) {
                listDiv.innerHTML = '<p class="empty">No RSVPs yet. Be the first!</p>';
                return;
            }

            let html = '';
            yes.forEach(a => {
                html += `
                    <div class="attendee">
                        <div class="attendee-info">
                            <div class="attendee-name">${a.name}</div>
                            ${a.dietary ? `<div class="attendee-note">${a.dietary}</div>` : ''}
                        </div>
                    </div>
                `;
            });

            if (maybe.length > 0) {
                html += '<div class="maybe-section">';
                html += `<div class="maybe-label">Maybe (${maybe.length})</div>`;
                maybe.forEach(a => {
                    html += `
                        <div class="maybe-item">
                            <span class="maybe-name">${a.name}</span>
                        </div>
                    `;
                });
                html += '</div>';
            }

            listDiv.innerHTML = html;
        }

        // Capture form submission and save to localStorage
        document.getElementById('my-form').addEventListener('submit', function(e) {
            const name = document.getElementById('name').value.trim();
            const status = document.getElementById('status').value;
            const dietary = document.getElementById('dietary').value.trim();

            if (name) {
                saveToLocal(name, status, dietary);
                setTimeout(displayAttendees, 500);
            }
        });

        // Initial display
        displayAttendees();
        
        // Refresh every 3 seconds to catch new submissions
        setInterval(displayAttendees, 3000);
    </script>
</body>
</html>
